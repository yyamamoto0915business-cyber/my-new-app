<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>参加費入力プレビュー</title>
  <style>
    :root {
      --ink: #1a1a1a;
      --muted: #888;
      --line: #e8e6e0;
      --paper: #fafaf8;
      --focus: #2B3A6B;
      --soft: #eef0f6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
      background: #f3f2ee;
      color: var(--ink);
      padding: 24px 16px 48px;
    }
    h1 {
      font-size: 15px;
      font-weight: 600;
      margin: 0 0 6px;
      color: var(--focus);
    }
    .lead {
      font-size: 12.5px;
      color: #5c5a54;
      margin: 0 0 20px;
      line-height: 1.5;
    }
    .grid {
      display: grid;
      gap: 16px;
      max-width: 420px;
      margin: 0 auto;
    }
    .card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
    }
    .badge {
      display: inline-block;
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.02em;
      padding: 3px 8px;
      border-radius: 999px;
      margin-bottom: 12px;
    }
    .badge-before { background: #f3e8ea; color: #a0455c; }
    .badge-after { background: #e8f0ea; color: #2f6b45; }
    label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    input[type="number"],
    input[type="text"] {
      display: block;
      width: 100%;
      border: 1px solid var(--line);
      background: var(--paper);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      color: var(--ink);
      outline: none;
    }
    input:focus {
      border-color: var(--focus);
      background: #fff;
    }
    .hint {
      margin-top: 6px;
      font-size: 11.5px;
      color: var(--muted);
      line-height: 1.4;
    }
    .presets {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }
    .chip {
      appearance: none;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 12.5px;
      min-height: 36px;
      cursor: pointer;
    }
    .chip[aria-pressed="true"] {
      border-color: var(--focus);
      background: var(--soft);
      color: var(--focus);
      font-weight: 600;
    }
    .note {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
      font-size: 11.5px;
      color: #5c5a54;
      line-height: 1.55;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .yen {
      font-size: 13px;
      color: #5c5a54;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="grid">
    <div>
      <h1>参加費入力 — 見た目プレビュー</h1>
      <p class="lead">実装前の比較です。下の「改善案」はタップ・入力できます。</p>
    </div>

    <section class="card" aria-label="現状">
      <span class="badge badge-before">現状</span>
      <label>参加費（円）</label>
      <input type="number" min="0" value="0" readonly />
      <p class="hint">0で無料イベント</p>
      <p class="note">空にできず、すぐ 0 に戻るため打ち直しにくい。</p>
    </section>

    <section class="card" aria-label="改善案">
      <span class="badge badge-after">改善案</span>
      <label>参加費（円）</label>
      <div class="presets" role="group" aria-label="よく使う金額">
        <button type="button" class="chip" data-price="0" aria-pressed="false">無料</button>
        <button type="button" class="chip" data-price="500" aria-pressed="false">500</button>
        <button type="button" class="chip" data-price="1000" aria-pressed="false">1,000</button>
        <button type="button" class="chip" data-price="3000" aria-pressed="false">3,000</button>
        <button type="button" class="chip" data-price="5000" aria-pressed="false">5,000</button>
      </div>
      <div class="row">
        <input
          id="price"
          type="text"
          inputmode="numeric"
          placeholder="例：1500"
          value=""
          autocomplete="off"
        />
        <span class="yen">円</span>
      </div>
      <p class="hint" id="hint">空欄か 0 で無料。プリセットも手入力もどちらでもOK</p>
      <p class="note">
        ・プリセットで即セット<br />
        ・入力欄は空のまま打って直せる<br />
        ・手入力すると一致するプリセットだけ選択状態になります
      </p>
    </section>
  </div>

  <script>
    const input = document.getElementById("price");
    const hint = document.getElementById("hint");
    const chips = [...document.querySelectorAll(".chip")];

    function digitsOnly(v) {
      return v.replace(/[^\d]/g, "");
    }

    function syncChips() {
      const raw = input.value.trim();
      const n = raw === "" ? null : Number(raw);
      chips.forEach((chip) => {
        const p = Number(chip.dataset.price);
        const on = n !== null && p === n;
        chip.setAttribute("aria-pressed", on ? "true" : "false");
      });
      if (raw === "" || n === 0) {
        hint.textContent = "空欄か 0 で無料イベントになります";
      } else {
        hint.textContent = `参加費 ${n.toLocaleString("ja-JP")} 円`;
      }
    }

    chips.forEach((chip) => {
      chip.addEventListener("click", () => {
        input.value = chip.dataset.price === "0" ? "0" : chip.dataset.price;
        syncChips();
        input.focus();
      });
    });

    input.addEventListener("input", () => {
      const cleaned = digitsOnly(input.value);
      if (input.value !== cleaned) input.value = cleaned;
      syncChips();
    });

    syncChips();
  </script>
</body>
</html>
