<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>マイアルバム 完成図</title>
    <style>
      :root {
        --paper: #f4efe6;
        --ink: #2c261f;
        --muted: #6b6258;
        --accent: #2f7d4e;
        --line: #ddd4c8;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 2;
        background: var(--paper);
        border-bottom: 1px solid var(--line);
        padding: 16px 24px 12px;
      }
      h1 { margin: 0; font-size: 20px; font-weight: 600; }
      p { margin: 6px 0 0; color: var(--muted); font-size: 13px; font-family: "Hiragino Sans", sans-serif; }
      nav {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 12px;
        font-family: "Hiragino Sans", sans-serif;
      }
      nav a {
        color: var(--ink);
        text-decoration: none;
        font-size: 12px;
        padding: 6px 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #fff;
      }
      nav a:hover { border-color: var(--accent); color: var(--accent); }
      main { padding: 24px; max-width: 920px; margin: 0 auto; }
      section { margin-bottom: 40px; }
      h2 {
        margin: 0 0 8px;
        font-size: 16px;
        color: var(--accent);
      }
      .note {
        margin: 0 0 12px;
        font-size: 13px;
        color: var(--muted);
        font-family: "Hiragino Sans", sans-serif;
      }
      img {
        width: 100%;
        height: auto;
        display: block;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: #fff;
      }
      .phone {
        max-width: 390px;
        margin: 0 auto;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>マイアルバム 完成図</h1>
      <p>タブは投稿 / アルバム / マップ。アルバムは本ではなく、誰かと一緒に作るコレクションです。</p>
      <nav>
        <a href="#overview">全体</a>
        <a href="#posts">投稿</a>
        <a href="#albums">アルバム一覧</a>
        <a href="#detail">アルバム詳細</a>
        <a href="#map">マップ</a>
      </nav>
    </header>
    <main>
      <section id="overview">
        <h2>全体</h2>
        <p class="note">3画面の並び。ボトムナビは今のまま（ホーム / マイアルバム / チェックイン / チャット / マイページ）。</p>
        <img src="mg-album-mock-overview.png" alt="マイアルバム完成図の全体" />
      </section>
      <section id="posts">
        <h2>1. 投稿</h2>
        <p class="note">自分の記録。カバー・プロフィール・3列グリッド。</p>
        <div class="phone"><img src="mg-album-mock-posts.png" alt="投稿タブ" /></div>
      </section>
      <section id="albums">
        <h2>2. アルバム一覧</h2>
        <p class="note">一緒に作るボタンと、ふたりのアイコンがついたカード。本はありません。</p>
        <div class="phone"><img src="mg-album-mock-albums-v2.png" alt="アルバム一覧" /></div>
      </section>
      <section id="detail">
        <h2>3. アルバム詳細</h2>
        <p class="note">誘う・写真を入れる。誰が入れたかが角の小さな顔でわかります。</p>
        <div class="phone"><img src="mg-album-mock-album-detail.png" alt="アルバム詳細" /></div>
      </section>
      <section id="map">
        <h2>4. マップ</h2>
        <p class="note">写真ピンと、場所ごとの件数。</p>
        <div class="phone"><img src="mg-album-mock-map.png" alt="マップタブ" /></div>
      </section>
    </main>
  </body>
</html>
